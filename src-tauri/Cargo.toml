[package]
name = "visual-second-brain"
version = "0.1.0"
description = "Visual Second Brain"
edition = "2024"
rust-version = "1.90"

[lib]
name = "vsb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.1"
rusqlite = { version = "0.41.0", features = ["bundled"] }
ulid = "3.0.0"
thiserror = "2.0.21"
percent-encoding = "2.3.2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[dev-dependencies]
tempfile = "3.27.0"
